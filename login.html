<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | HireSight AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-card">
            <h2>Welcome Back</h2>
            <p class="auth-subtitle">
                Login to your hiring dashboard
            </p>

            <input type="email" placeholder="Work email">
            <input type="password" placeholder="Password">

            <button class="cta-btn auth-btn" onclick="location.href='resume.html'">
                Login
            </button>

            <p class="auth-note">
                Demo mode enabled — no authentication required
            </p>
        </div>
    </div>

</body>
</html>
